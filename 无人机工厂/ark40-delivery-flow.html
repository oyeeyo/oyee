<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ARK40 飞机出厂流程 · H5 原型</title>
<style>
:root{
  --pri:#2e6be6; --pri-d:#1f56c8; --pri-bg:#eef3ff;
  --ok:#17a56a; --ok-bg:#e6f7ef;
  --red:#e5484d; --red-bg:#fdecec;
  --org:#f59a00; --org-bg:#fff4de;
  --txt:#1f2733; --sub:#68738a; --faint:#9aa4b5;
  --bg:#f3f5f9; --card:#ffffff; --line:#e6eaf2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 700px at 50% -10%,#31405e 0%,#1c2434 55%,#141a26 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--txt)}
/* ===== 手机壳（桌面预览） ===== */
.phone{position:relative;width:390px;height:min(844px,96vh);background:#0c0f14;border-radius:54px;padding:13px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 2px #2b3342,inset 0 0 0 2px #1a2130;flex:none}
.phone:before{content:"";position:absolute;right:-3px;top:150px;width:3px;height:64px;background:#2b3342;border-radius:2px}
.phone:after{content:"";position:absolute;left:-3px;top:130px;width:3px;height:88px;background:#2b3342;border-radius:2px}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:26px;background:#0c0f14;border-radius:16px;z-index:60;pointer-events:none}
.statusbar{flex:none;height:42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:13px;font-weight:600;color:var(--txt);background:transparent;z-index:55}
.statusbar .sb-r{display:flex;align-items:center;gap:5px;font-size:11px}
.bat{display:inline-block;width:20px;height:10px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.85}
.bat:before{content:"";position:absolute;inset:1.5px 4px 1.5px 1.5px;background:currentColor;border-radius:1px}
#view{flex:1;min-height:0;position:relative}
/* 移动端全屏 */
@media (max-width:520px){
  body{background:var(--bg);display:block;overflow:auto}
  .phone{width:100vw;height:100vh;height:100dvh;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
  .phone:before,.phone:after,.notch{display:none}
  .screen{border-radius:0}
  .statusbar{display:none}
}
/* ===== 页面骨架 ===== */
.page{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.page-head{flex:none;background:var(--bg)}
.page-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
.page-foot{flex:none;display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.page-foot .btn{flex:1}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.nav-back{width:38px;height:38px;border:none;background:none;font-size:24px;line-height:1;color:var(--txt);cursor:pointer}
.nav-title{font-size:16px;font-weight:600}
.nav-ph{width:38px}
.nav-btn{border:none;background:none;color:var(--pri);font-size:13px;font-weight:600;cursor:pointer;padding:8px}
/* ===== 通用组件 ===== */
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(31,42,68,.05)}
.card-t{font-size:14px;font-weight:600;margin-bottom:8px}
.sec-t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sub);margin:14px 4px 8px}
.sec-t .cnt{font-size:11px;background:var(--pri-bg);color:var(--pri);border-radius:9px;padding:1px 8px;font-weight:600}
.chip{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f6;color:var(--sub);font-weight:500}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--pri-bg);color:var(--pri)}
.b-green{background:var(--ok-bg);color:var(--ok)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-orange{background:var(--org-bg);color:#c07c00}
.b-gray{background:#eef1f6;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:12px 16px;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.primary{background:var(--pri);color:#fff}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.danger{background:var(--red);color:#fff}
.btn.plain{background:#eef1f6;color:var(--txt)}
.btn.dis{background:#eef1f6;color:var(--faint);cursor:not-allowed}
.btn.sm{font-size:13px;padding:7px 14px;border-radius:8px;flex:none}
.btn.lg{width:100%;padding:13px}
.empty{padding:26px 12px;text-align:center;color:var(--faint);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3f8;font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--sub);flex:none}
.kv .v{font-weight:600;text-align:right}
/* ===== 飞机信息条 + 节点进度条 ===== */
.fixed-top{flex:none;background:linear-gradient(160deg,#2e6be6 0%,#2452b8 100%);padding:4px 12px 12px;color:#fff}
.ibar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
.ibar-sn{font-size:18px;font-weight:700;letter-spacing:.5px}
.ibar-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.ibar .chip{background:rgba(255,255,255,.16);color:#fff}
.userchip{flex:none;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-size:11px;border-radius:14px;padding:5px 10px;cursor:pointer;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:flex;align-items:flex-start;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 6px}
.step{flex:1;text-align:center;position:relative}
.step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.35)}
.step.done .dot{background:#fff;color:var(--ok);border-color:#fff}
.step.cur .dot{background:#ffd166;color:#7a5200;border-color:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.25)}
.step .nm{font-size:12px;margin-top:5px;font-weight:600;opacity:.92}
.step.off .nm{opacity:.55}
.step .tm{font-size:10px;margin-top:2px;opacity:.75}
.step-line{flex:none;width:26px;height:2px;background:rgba(255,255,255,.28);margin-top:12px;border-radius:1px}
.step-line.on{background:#fff}
/* ===== 待办 ===== */
.todo{display:flex;align-items:center;gap:10px}
.todo-ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--pri-bg);display:flex;align-items:center;justify-content:center;font-size:18px}
.todo-m{flex:1;min-width:0}
.todo-t{font-size:14px;font-weight:600}
.todo-d{font-size:12px;color:var(--sub);margin-top:2px;word-break:break-all}
.todo-r{font-size:11px;color:var(--faint);margin-top:3px}
.done-card .kv .v{color:var(--ok)}
/* ===== 折叠面板 / 表单 ===== */
.collapse{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(31,42,68,.05)}
.col-h{display:flex;align-items:center;gap:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
.col-h .col-n{margin-left:auto;font-size:11px;color:var(--pri);background:var(--pri-bg);padding:2px 8px;border-radius:9px;font-weight:600}
.col-h .chev{flex:none;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.collapse:not(.open) .chev{transform:rotate(-45deg)}
.col-b{padding:0 12px 12px;border-top:1px solid #f1f3f8}
.collapse:not(.open) .col-b{display:none}
.sub-t{font-size:13px;font-weight:600;color:var(--txt);margin:12px 0 4px;padding-left:8px;border-left:3px solid var(--pri)}
.cat-t{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#5b8def,#7fa5f0);border-radius:8px;padding:6px 10px;margin:12px 0 2px}
.req{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fcfdff}
.req.invalid{border-color:var(--red);background:#fffafa}
.req-meta{font-size:12px;color:var(--sub);line-height:1.6}
.req-meta b{color:var(--txt);font-weight:600}
.req-meta .inst{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.rec{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:52px;background:#fff;color:var(--txt)}
.rec:focus{outline:none;border-color:var(--pri)}
.pills{display:flex;gap:8px;margin-top:8px}
.pill{flex:1;text-align:center;font-size:13px;font-weight:600;padding:8px 0;border-radius:8px;border:1px solid var(--line);color:var(--sub);cursor:pointer;background:#fff}
.pill input{display:none}
.pill.pass.sel{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.fail.sel{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.ro-record{font-size:13px;background:#f6f8fb;border-radius:8px;padding:8px;margin-top:8px;line-height:1.6}
.ro-record .lab{color:var(--faint);font-size:11px;display:block}
.form-meta{display:flex;gap:6px;flex-wrap:wrap;padding:2px 2px 10px}
.form-meta .chip{background:rgba(255,255,255,.16);color:#fff}
.up-in{border:1.5px dashed #c6d2e8;border-radius:10px;padding:18px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;background:#fafcff}
.up-in .req-star{color:var(--red);font-weight:700}
.up-in.invalid{border-color:var(--red);background:#fffafa}
.up-chip{display:flex;align-items:center;gap:8px;background:var(--pri-bg);border-radius:10px;padding:10px}
.up-chip .fn{flex:1;font-size:13px;font-weight:600;color:var(--pri);word-break:break-all}
.up-chip .fs{font-size:11px;color:var(--sub)}
.up-chip .rm{border:none;background:none;color:var(--red);font-size:16px;cursor:pointer}
.rej-banner{background:var(--red-bg);border:1px solid #f6c9cb;color:#b03a3e;border-radius:10px;padding:10px;font-size:12px;line-height:1.6;margin-bottom:10px}
.rej-banner b{display:block;margin-bottom:2px}
/* ===== 扫码页 ===== */
.scanbox{position:relative;width:190px;height:190px;margin:26px auto 12px;border-radius:16px;background:#fff;box-shadow:0 6px 24px rgba(31,42,68,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.scanbox .qr{font-size:64px;opacity:.85}
.corner{position:absolute;width:26px;height:26px;border:3px solid var(--pri)}
.c1{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.c2{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.c3{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.c4{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scan-line{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--pri),transparent);animation:scan 2.2s ease-in-out infinite;box-shadow:0 0 8px var(--pri)}
@keyframes scan{0%,100%{top:14px}50%{top:calc(100% - 16px)}}
.scan-tip{text-align:center;color:var(--sub);font-size:13px;margin-bottom:14px}
.row-in{display:flex;gap:8px}
.row-in input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff}
.row-in input:focus{outline:none;border-color:var(--pri)}
.ac-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid #f1f3f8;cursor:pointer}
.ac-row:last-child{border-bottom:none}
.ac-row:active{background:#f7f9fd}
.ac-sn{font-size:14px;font-weight:700}
.ac-sub{font-size:11px;color:var(--faint);margin-top:2px}
/* ===== 履历 / 报告列表 ===== */
.rep{display:flex;align-items:center;gap:10px;cursor:pointer}
.rep:active{background:#f7f9fd}
.rep-l{flex:1;min-width:0}
.rep-id{font-size:13px;font-weight:700}
.rep-sub{font-size:11px;color:var(--faint);margin-top:3px}
.rep-r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rep-r .tm{font-size:10px;color:var(--faint)}
/* ===== 登录页 ===== */
.acct{display:flex;align-items:center;gap:10px;cursor:pointer}
.acct:active{background:#f7f9fd}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.acct-m{flex:1;min-width:0}
.acct-n{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.acct-d{font-size:11px;color:var(--faint);margin-top:3px}
/* ===== 无权限 ===== */
.noperm{padding:70px 24px;text-align:center}
.noperm .ic{font-size:52px}
.noperm h2{font-size:18px;margin:14px 0 10px}
.noperm p{font-size:13px;color:var(--sub);line-height:1.8}
.noperm .card{text-align:left;margin-top:18px}
/* ===== 弹窗 / Toast / 悬浮按钮 ===== */
.modal-mask{position:absolute;inset:0;background:rgba(15,22,36,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;transition:opacity .18s}
.modal-mask.show{opacity:1}
.modal{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .2s;max-height:82%;overflow-y:auto}
.modal-mask.show .modal{transform:translateY(0)}
.modal.center{align-items:center}
.modal-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:12px}
.modal-body{font-size:13px;color:var(--txt)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{flex:1;padding:12px}
.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(20,26,38,.92);color:#fff;font-size:12px;padding:9px 14px;border-radius:20px;z-index:200;opacity:0;transition:all .2s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:absolute;right:14px;bottom:24px;z-index:90;background:#0f1626;color:#fff;border:none;border-radius:22px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(15,22,38,.35);cursor:pointer;display:flex;align-items:center;gap:5px}
.fab:active{opacity:.85}
/* ===== 调试面板 / 整体判定 ===== */
.dbg-sec{font-size:12px;color:var(--faint);font-weight:600;margin:12px 0 6px}
.dbg-row{display:flex;gap:8px;margin-top:8px}
.dbg-row .btn{flex:1;font-size:13px;padding:10px 6px}
.ov-sum{background:#f6f8fb;border-radius:10px;padding:10px;font-size:13px;text-align:center;font-weight:600}
.ov-sum .red{color:var(--red)} .ov-sum .grn{color:var(--ok)}
.ov-hint{font-size:12px;color:var(--sub);margin:10px 2px;line-height:1.6}
.ov-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;cursor:pointer;background:#fff}
.ov-opt input{accent-color:var(--pri);width:17px;height:17px;flex:none}
.ov-opt small{display:block;color:var(--faint);font-size:11px;margin-top:2px;font-weight:400}
.ov-opt span{font-size:14px;font-weight:700}
.ov-opt.sel{border-color:var(--pri);background:var(--pri-bg)}
.mtex{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;min-height:70px;resize:vertical}
.state-chip{display:inline-block;font-size:11px;border-radius:8px;padding:2px 8px;margin-left:6px}
/* ===== 履历页（档案样式） ===== */
.hist-top{flex:none;background:linear-gradient(160deg,#4a86f0 0%,#2452b8 100%);color:#fff;padding:0 10px 20px}
.hist-top .nav-back,.hist-top .nav-title{color:#fff}
.hist-top .nav-btn{color:#fff}
.hist-sn{font-size:36px;font-weight:800;text-align:center;letter-spacing:2px;margin-top:-4px}
.hist-sub{display:flex;gap:6px;justify-content:center;margin:10px 0 14px}
.hist-sub .chip{background:rgba(255,255,255,.18);color:#fff}
.hist-btn{display:block;margin:0 auto;background:#fff;color:var(--pri);border:none;border-radius:19px;padding:10px 30px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(15,35,80,.28)}
.hist-btn:active{opacity:.85}
.hist-btn.off{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;cursor:default}
.hist-drone{background:linear-gradient(180deg,#d9e8fc 0%,var(--bg) 100%);padding:12px 0 2px;text-align:center}
.hist-body .card-t{display:flex;align-items:center}
.card-t .ci{flex:none;width:20px;height:20px;border-radius:50%;background:var(--pri-bg);color:var(--pri);font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-right:7px;font-style:normal}
.copyright{text-align:center;color:#b3bccb;font-size:11px;margin:16px 0 4px}
/* ===== 整机检验报告（对外） ===== */
.rep-view{border:none;background:none;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;margin-left:auto}
.table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.robt{width:100%;border-collapse:collapse;background:#fff;font-size:11px;line-height:1.5}
.robt th,.robt td{border:1px solid #dfe5ef;padding:6px 5px;text-align:left;vertical-align:top;word-break:break-all}
.robt thead th{background:#f2f5fa;color:#5a6478;font-weight:600;text-align:center;white-space:nowrap}
.robt .cat-td{background:#f8fafd;font-weight:700;color:var(--txt);text-align:center}
.robt .ok{color:var(--ok);font-weight:700;text-align:center;white-space:nowrap}
.concl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.concl-t{font-size:13px;font-weight:600}
.concl-t b{color:var(--ok);margin-left:6px}
.seal{flex:none;transform:rotate(-12deg);opacity:.92}
.apv{display:flex;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid #f1f3f8;font-size:12px}
.apv:last-child{border-bottom:none}
.apv .ck{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.apv .al{color:var(--sub)}
.apv .ar{margin-left:auto;color:var(--ok);font-weight:600}
.apv .ar time{color:var(--faint);font-weight:400;margin-left:5px;font-size:11px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen" id="screenWrap">
    <div class="statusbar"><span>9:41</span><span class="sb-r"><span>5G</span><span class="bat"></span></span></div>
    <div id="view"></div>
  </div>
  <button class="fab" id="fab">🛠 调试</button>
</div>
<script>
'use strict';
/* ================= 工具 ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const clone=o=>JSON.parse(JSON.stringify(o));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDT(ts){if(!ts)return '—';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function fmtD(ts){if(!ts)return '—';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function todayStr(){return fmtD(Date.now());}
let toastTimer=null;
function toast(msg,type){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';$('#screenWrap').appendChild(el);}el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}
function modal(opt){
  const mask=document.createElement('div');mask.className='modal-mask';
  mask.innerHTML='<div class="modal">'+(opt.title?'<div class="modal-title">'+opt.title+'</div>':'')+'<div class="modal-body">'+opt.html+'</div><div class="modal-btns">'+opt.buttons.map((b,i)=>'<button class="btn '+(b.type||'plain')+'" data-i="'+i+'">'+esc(b.text)+'</button>').join('')+'</div></div>';
  const close=()=>{mask.classList.remove('show');setTimeout(()=>mask.remove(),190);};
  mask.addEventListener('click',e=>{if(e.target===mask&&opt.dismissible!==false)close();});
  $$('.modal-btns .btn',mask).forEach(b=>b.addEventListener('click',()=>{
    const btn=opt.buttons[+b.dataset.i];
    if(btn.onClick){const r=btn.onClick({close,mask});if(r===false)return;}
    close();
  }));
  $('#screenWrap').appendChild(mask);
  requestAnimationFrame(()=>mask.classList.add('show'));
  return {close,mask};
}

/* ================= 节点1：试飞提交 ================= */
function submitTestFlight(ac,report,data,overall){
  Object.assign(report,{items:data.items,logFile:data.logFile,anomaly:data.anomaly,overall,
    submitter:pickSubmitter(),submittedAt:Date.now(),completedAt:Date.now()});
  if(overall==='pass'){ /* 合格：报告锁定通过，推进待出库检验（原型不涉及返修机） */
    report.status='passed';
    ac.dates.tfPass=report.submittedAt;
    ac.progress='PENDING_OB';
    ac.reports.push(newOutboundDraft(ac,null));
  }else{ /* 不合格：报告锁定未通过，复飞次数+1，自动生成新试飞报告 */
    report.status='failed';
    ac.flightCount++;
    ac.reports.push(newTestFlightDraft(ac));
  }
  clearDraft(report.id);saveDB();
}
/* ================= 节点2：出货检验提交 ================= */
function submitOutbound(ac,report,data){ /* 最终判定合格：进入后台审核 */
  Object.assign(report,{items:data.items,anomaly:data.anomaly,overall:'pass',
    submitter:pickSubmitter(),submittedAt:Date.now()});
  report.status='in-review';
  ac.dates.inspect=report.submittedAt; /* 检验日期 */
  ac.progress='REVIEWING';
  clearDraft(report.id);saveDB();
  scheduleAutoBackend(ac.sn);
}
function failOutbound(ac,report,data){ /* 最终判定不合格：锁定未通过，不流转审核，生成新检验报告 */
  Object.assign(report,{items:data.items,anomaly:data.anomaly,overall:'fail',
    submitter:pickSubmitter(),submittedAt:Date.now(),completedAt:Date.now()});
  report.status='failed';
  ac.reports.push(newOutboundDraft(ac,null));
  clearDraft(report.id);saveDB();
}
/* ================= 后台审核 / 批准（前台模拟：约5秒自动流转，通过与否随机） ================= */
const AUTO_TIMERS={},AUTO_DELAY=5000;
const REJECT_REASONS={
 review:['随机文件核查记录不完整，请补充合格证编号后重新提交','检验记录与实际状态存在出入，请复核后重新提交','外观检查项缺少影像佐证材料，请补充'],
 approve:['出厂文件齐套性未达标，暂不批准放行','部分检验数据未达出厂标准，退回检验环节复核','批准材料缺少责任人签名，请补充后重新提交']
};
function scheduleAutoBackend(sn){
  clearTimeout(AUTO_TIMERS[sn]);delete AUTO_TIMERS[sn];
  const ac=DB.aircraft[sn];if(!ac)return;
  if(ac.progress==='REVIEWING'||ac.progress==='APPROVING'){
    const stage=ac.progress==='REVIEWING'?'review':'approve';
    AUTO_TIMERS[sn]=setTimeout(function(){autoBackendAct(sn,stage);},AUTO_DELAY);
  }
}
function autoBackendAct(sn,stage){
  const ac=DB.aircraft[sn];if(!ac)return;
  delete AUTO_TIMERS[sn];
  const pass=Math.random()<(stage==='review'?0.7:0.8); /* 随机种子：审核70%通过 / 批准80%通过 */
  const pool=REJECT_REASONS[stage];
  const reason=pass?null:pool[Math.floor(Math.random()*pool.length)];
  const ok=stage==='review'?backendReview(ac,pass,reason):backendApprove(ac,pass,reason);
  if(ok)toast(sn+' · '+(stage==='review'?'后台审核':'后台批准')+(pass?'已通过 ✓':'已驳回：'+reason),pass?'':'warn');
  if(S.sn===sn)render();
}
function resumeAutoTimers(){Object.keys(DB.aircraft).forEach(scheduleAutoBackend);}
function activeOB(ac){return ac.reports.slice().reverse().find(r=>r.type==='outbound');}
function backendReview(ac,pass,reason){
  if(ac.progress!=='REVIEWING')return false;
  clearTimeout(AUTO_TIMERS[ac.sn]);
  const r=activeOB(ac);
  r.reviewer=REVIEWER_INFO; /* 记录审核人 */
  if(pass){r.status='in-approval';r.reviewAt=Date.now();ac.dates.review=r.reviewAt;ac.progress='APPROVING';}
  else{r.status='rejected';r.rejectedStage='review';r.rejectReason=reason;r.rejectedAt=Date.now();
    ac.reports.push(newOutboundDraft(ac,{stage:'review',reason,from:r.id}));ac.progress='PENDING_OB';}
  saveDB();scheduleAutoBackend(ac.sn);return true;
}
function backendApprove(ac,pass,reason){
  if(ac.progress!=='APPROVING')return false;
  clearTimeout(AUTO_TIMERS[ac.sn]);
  const r=activeOB(ac);
  r.approver=APPROVER_INFO; /* 记录批准人 */
  if(pass){r.status='approved';r.approveAt=Date.now();r.completedAt=r.approveAt;
    ac.dates.approve=r.approveAt;ac.dates.delivery=r.approveAt;ac.progress='DELIVERED';}
  else{r.status='rejected';r.rejectedStage='approve';r.rejectReason=reason;r.rejectedAt=Date.now();
    ac.reports.push(newOutboundDraft(ac,{stage:'approve',reason,from:r.id}));ac.progress='PENDING_OB';}
  saveDB();scheduleAutoBackend(ac.sn);return true;
}

const S={view:'scan',params:{},sn:null};
function go(view,params){
  S.params=params||{};
  if(view==='summary'){const u=currentUser();if(!u){S.view='login';}else if(!u.factory){S.view='noperm';}else{S.view='summary';}}
  else if(view==='testflight'||view==='outbound'){
    const u=currentUser(),ac=getAc(S.sn);
    const need=view==='testflight'?'captain':'inspector';
    if(!u||u.role!==need||!ac||ac.progress!==(view==='testflight'?'PENDING_TF':'PENDING_OB')){toast('当前角色或飞机状态不可进入该表单','warn');S.view='summary';}

function stepsHTML(ac){
  const st=ac.progress;

  const ac=getAc(S.sn);
  const r=ac?ac.reports.filter(x=>x.type==='outbound'&&x.status==='approved').slice(-1)[0]:null;
  if(!r)return '<div class="page">'+navBar({title:'整机检验报告',back:'history'})+'<div class="page-body"><div class="empty">暂无已通过的整机检验报告 · 出厂流程完成后自动归档至此</div></div></div>';
  const tpl=getTemplate(ac.model).outbound;
  let tbody='';
  tpl.categories.forEach((a,ai)=>{
    let span=0;a.items.forEach(it=>it.contents.forEach(c=>span+=c.reqs.length));
    let first=true;
    a.items.forEach((it,ii)=>{
      it.contents.forEach((c,ci)=>{
        c.reqs.forEach((rq,ri)=>{
          const k='a'+ai+'i'+ii+'c'+ci+'r'+ri,v=r.items[k]||{};
          tbody+='<tr>'+(first?'<td class="cat-td" rowspan="'+span+'">'+esc(a.cat)+'</td>':'')+
            '<td>'+esc(it.item)+'</td><td>'+esc(c.content)+'</td><td>'+esc(rq.text)+'</td>'+
            '<td>'+esc(v.record||'—')+'</td><td class="ok">'+(v.result==='pass'?'合格':'不合格')+'</td></tr>';
          first=false;
        });
      });
    });
  });
  const apr=[
    {lab:'检验确认',who:r.submitter,t:r.submittedAt},
    {lab:'审核确认',who:r.reviewer,t:r.reviewAt},
    {lab:'批准人确认',who:r.approver,t:r.approveAt}
  ].filter(a=>a.who&&a.t);
  return '<div class="page">'+navBar({title:'整机检验报告',back:'history'})+
  '<div class="page-body">'+
   '<div class="card">'+
    '<div class="kv"><span class="k">飞机编号</span><span class="v">'+ac.sn+'</span></div>'+
    '<div class="kv"><span class="k">报告编号</span><span class="v">'+r.id+'</span></div>'+
    '<div class="kv"><span class="k">检验结论</span><span class="v" style="color:var(--ok)">检验合格 · 准予出厂</span></div>'+
    '<div class="kv"><span class="k">报告日期</span><span class="v">'+fmtD(r.approveAt)+'</span></div>'+
   '</div>'+
   '<div class="card"><div class="card-t">出货检验报告明细</div>'+
    '<div class="table-wrap"><table class="robt"><thead><tr><th>类别</th><th>检验项目</th><th>检验内容</th><th>检验要求</th><th>检验记录</th><th>检验结果</th></tr></thead><tbody>'+tbody+'</tbody></table></div>'+
   '</div>'+
   '<div class="card"><div class="card-t">其他异常记录</div><div style="font-size:13px;color:var(--sub);line-height:1.7">'+esc(r.anomaly||'无')+'</div></div>'+
   '<div class="card"><div class="concl"><div class="concl-t">出厂检查结论：<b>检验合格，准予出厂</b></div>'+sealSVG()+'</div></div>'+
   '<div class="card"><div class="card-t">电子审批</div>'+
    apr.map(a=>'<div class="apv"><span class="ck">✓</span><span class="al">'+a.lab+'：'+esc(a.who.name)+'（'+esc(a.who.emp)+' · '+esc(a.who.dept||'')+'）</span><span class="ar">合格<time>'+fmtDT(a.t)+'</time></span></div>').join('')+
   '</div>'+
   '<div class="copyright">本报告由系统自动生成并加盖电子公章，具有同等效力</div>'+
  '</div></div>';
 }
};

 html(){

  }else{
    h+='<div class="card empty">'+(ac.progress==='DELIVERED'?'🎉 本飞机已完成出厂，全部流程已归档':'当前无待办事项')+'</div>';

    h+='<div class="sec-t">出厂日期（系统自动回填）</div><div class="card done-card">'+
      '<div class="kv"><span class="k">试飞通过</span><span class="v">'+fmtDT(ac.dates.tfPass)+'</span></div>'+
      '<div class="kv"><span class="k">出货检验</span><span class="v">'+fmtDT(ac.dates.inspect)+'</span></div>'+
      '<div class="kv"><span class="k">后台审核</span><span class="v">'+fmtDT(ac.dates.review)+'</span></div>'+

/* ---- 表单：公共 ---- */
const FORM={reportId:null,type:null,logFile:null};
let autoSaveTimer=null;
function buildReqRow(k,rq,v){
  return '<div class="req" data-key="'+k+'"><div class="req-meta"><b>检验要求</b> '+esc(rq.text)+'</div>'+
  '<textarea class="rec" rows="2" placeholder="请填写检验记录…">'+esc(v.record||'')+'</textarea>'+
  '<div class="pills"><label class="pill pass'+(v.result==='pass'?' sel':'')+'"><input type="radio" name="res_'+k+'" value="pass"'+(v.result==='pass'?' checked':'')+'>合格</label>'+
  '<label class="pill fail'+(v.result==='fail'?' sel':'')+'"><input type="radio" name="res_'+k+'" value="fail"'+(v.result==='fail'?' checked':'')+'>不合格</label></div></div>';
}
function collectNow(){
  const items={};
  $$('#formBody .req[data-key]').forEach(el=>{const k=el.dataset.key;const chk=$('input:checked',el);
    items[k]={record:$('.rec',el).value.trim(),result:chk?chk.value:''};});
  return {items,logFile:FORM.logFile,anomaly:$('#anomaly')?$('#anomaly').value.trim():''};
}
function scheduleAutoSave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{if(FORM.reportId)saveDraftStore(FORM.reportId,collectNow());},500);}
function updateGroupCounts(){
  $$('#formBody .collapse').forEach(col=>{
    const reqs=$$('.req[data-key]',col);
    const done=reqs.filter(r=>$('input:checked',r)).length;
    const n=$('.col-n',col);if(n)n.textContent=done+'/'+reqs.length;
  });
}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';}
function upHTML(){
  if(FORM.logFile)return '<div class="up-chip"><span>📄</span><span class="fn">'+esc(FORM.logFile.name)+'</span><span class="fs">'+esc(FORM.logFile.size)+'</span><button class="rm" id="upRm">✕</button></div>';
  return '<div class="up-in" id="upIn">📤 点击选择试飞日志文件 <span class="req-star">*必传</span></div>';
}
function refreshUp(){const a=$('#upArea');if(a)a.innerHTML=upHTML();bindUp();}
function bindUp(){
  const inn=$('#upIn');if(inn)inn.onclick=()=>{const fi=$('#fileIn');if(fi)fi.click();};
  const rm=$('#upRm');if(rm)rm.onclick=e=>{e.stopPropagation();FORM.logFile=null;refreshUp();scheduleAutoSave();};
}
function mountForm(){
  bindUp();
  const fi=$('#fileIn');
  if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;FORM.logFile={name:f.name,size:fmtSize(f.size)};refreshUp();scheduleAutoSave();toast('试飞日志已上传');};
  $('#btnDraft').onclick=()=>{saveDraftStore(FORM.reportId,collectNow());toast('已暂存（本地），再次进入自动恢复');};
  $('#btnSubmit').onclick=()=>{FORM.type==='testflight'?submitTestFlightFlow():submitOutboundFlow();};
  updateGroupCounts();
}

/* ---- 提交流程 ---- */
function submitTestFlightFlow(){
  const ac=getAc(S.sn),r=findReport(ac,FORM.reportId);
  const data=collectNow();
  const keys=tfKeys(getTemplate(ac.model));
  const missing=keys.filter(k=>!data.items[k]||!data.items[k].result);
  $$('#formBody .req[data-key]').forEach(el=>{if(missing.indexOf(el.dataset.key)>-1)el.classList.add('invalid');});
  if(!data.logFile){const inn=$('#upIn');if(inn)inn.classList.add('invalid');}
  if(missing.length||!data.logFile){
    toast(missing.length?('还有 '+missing.length+' 项未选择检验结果'+(data.logFile?'':'，且试飞日志未上传')):'请先上传试飞日志（必传）');
    const first=$('#formBody .invalid');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const failCnt=keys.filter(k=>data.items[k].result==='fail').length;
  const def=failCnt>0?'fail':'pass';
  const m=modal({title:'整体检验判定',dismissible:false,html:
   '<div class="ov-sum">共检 '+keys.length+' 项 · 合格 '+(keys.length-failCnt)+' 项 · '+(failCnt?'<span class="red">不合格 '+failCnt+' 项</span>':'<span class="grn">无不合格项</span>')+'</div>'+
   '<div class="ov-hint">'+(failCnt?'检测到不合格项，默认判定为「不合格」，可手动切换。':'全部项目合格，默认判定为「合格」，可手动切换。')+'</div>'+
   '<label class="ov-opt'+(def==='pass'?' sel':'')+'"><input type="radio" name="ov" value="pass"'+(def==='pass'?' checked':'')+'><div><span>合格</span><small>报告锁定为通过，进度推进至「待出库检验」</small></div></label>'+
   '<label class="ov-opt'+(def==='fail'?' sel':'')+'"><input type="radio" name="ov" value="fail"'+(def==='fail'?' checked':'')+'><div><span>不合格</span><small>报告锁定为未通过，试飞次数 +1，自动生成新的待测试试飞报告</small></div></label>',
   buttons:[{text:'取消'},{text:'确认提交',type:'primary',onClick:({mask,close})=>{
     const ov=$('input[name=ov]:checked',mask);
     close();
     submitTestFlight(ac,r,data,ov.value);
     toast(ov.value==='pass'?'报告已锁定通过，推进至「待出库检验」':'报告已锁定未通过，试飞次数+1，已生成新试飞报告');
     go('summary');
   }}]
  });
}
function submitOutboundFlow(){
  const ac=getAc(S.sn),r=findReport(ac,FORM.reportId);
  const data=collectNow();
  const keys=obKeys(getTemplate(ac.model));
  const missing=keys.filter(k=>!data.items[k]||!data.items[k].result);
  $$('#formBody .req[data-key]').forEach(el=>{if(missing.indexOf(el.dataset.key)>-1)el.classList.add('invalid');});
  if(missing.length){
    toast('还有 '+missing.length+' 项未选择检验结果');
    const first=$('#formBody .invalid');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const failCnt=keys.filter(k=>data.items[k].result==='fail').length;
  const def=failCnt>0?'fail':'pass';
  modal({title:'最终产品判定',dismissible:false,html:
   '<div class="ov-sum">共检 '+keys.length+' 项 · 合格 '+(keys.length-failCnt)+' 项 · '+(failCnt?'<span class="red">不合格 '+failCnt+' 项</span>':'<span class="grn">无不合格项</span>')+'</div>'+
   '<div class="ov-hint">检验完成后请对最终产品是否合格进行确认。'+(failCnt?'检测到不合格项，默认判定为「不合格」，可手动切换。':'全部项目合格，默认判定为「合格」，可手动切换。')+'</div>'+
   '<label class="ov-opt'+(def==='pass'?' sel':'')+'"><input type="radio" name="ov" value="pass"'+(def==='pass'?' checked':'')+'><div><span>合格</span><small>报告锁定为通过，流转至后台审核（约5秒自动出结果，通过与否随机）</small></div></label>'+
   '<label class="ov-opt'+(def==='fail'?' sel':'')+'"><input type="radio" name="ov" value="fail"'+(def==='fail'?' checked':'')+'><div><span>不合格</span><small>报告锁定为未通过，不流转审核，自动生成新的待检验报告</small></div></label>',
   buttons:[{text:'取消'},{text:'确认提交',type:'primary',onClick:({mask,close})=>{
     const ov=$('input[name=ov]:checked',mask);
     close();
     if(ov.value==='pass'){submitOutbound(ac,r,data);toast('最终判定合格，已进入后台审核');}
     else{failOutbound(ac,r,data);toast('最终判定不合格，不流转审核，已生成新的检验报告');}
     go('summary');
   }}]});
}
/* ---- 调试面板（模拟后端审核/批准） ---- */
function openDebug(){
  const ac=S.sn?getAc(S.sn):null;
  let html='<div class="dbg-sec">当前飞机'+(ac?(' · '+ac.sn):'')+'</div>';
  if(ac){
    html+='<div class="card" style="margin:0"><div class="card-t">'+ac.sn+' <span class="badge '+PROGRESS_BADGE[ac.progress]+'">'+PROGRESS_TXT[ac.progress]+'</span></div>';
    if(ac.progress==='REVIEWING')html+='<div style="font-size:12px;color:var(--sub);margin-bottom:6px">模拟后台审核（审核人：王审核 SF09003）· 默认约5秒自动流转且结果随机，手动触发将覆盖自动结果</div><div class="dbg-row"><button class="btn primary sm" data-dbg="review-pass">✓ 审核通过</button><button class="btn danger sm" data-dbg="review-rej">✕ 审核驳回</button></div>';
    else if(ac.progress==='APPROVING')html+='<div style="font-size:12px;color:var(--sub);margin-bottom:6px">模拟后台批准（批准人：赵批准 SF09004）· 默认约5秒自动流转且结果随机，手动触发将覆盖自动结果</div><div class="dbg-row"><button class="btn primary sm" data-dbg="appr-pass">✓ 批准通过</button><button class="btn danger sm" data-dbg="appr-rej">✕ 批准驳回</button></div>';
    else html+='<div style="font-size:12px;color:var(--faint)">当前进度无后台环节可模拟（仅审核中/批准中状态可操作）</div>';
    html+='</div>';
  }else{
    html+='<div class="empty" style="padding:10px">请先扫码选择飞机</div>';
  }
  html+='<div class="dbg-sec">切换飞机</div><div class="card" style="margin:0;padding:4px 12px">'+
   Object.keys(DB.aircraft).map(sn=>{const a=DB.aircraft[sn];return '<div class="ac-row" data-dbg-sn="'+sn+'"><div class="ac-sn">'+sn+'</div><span class="badge '+PROGRESS_BADGE[a.progress]+'">'+PROGRESS_TXT[a.progress]+'</span></div>';}).join('')+'</div>';
  html+='<div class="dbg-row" style="margin-top:14px"><button class="btn plain" data-dbg="reset">♻ 重置全部演示数据</button></div>';
  const m=modal({title:'调试面板 · 模拟后端',html,buttons:[{text:'关闭'}]});
  $$('[data-dbg]',m.mask).forEach(b=>b.addEventListener('click',()=>{const act=b.dataset.dbg;m.close();handleDbg(act);}));
  $$('[data-dbg-sn]',m.mask).forEach(b=>b.addEventListener('click',()=>{m.close();S.sn=b.dataset.dbgSn;go('history');toast('已切换至 '+b.dataset.dbgSn);}));
}
function handleDbg(act){
  if(act==='reset'){
    modal({title:'重置演示数据',html:'将清空本地全部数据（飞机档案 / 报告 / 暂存 / 登录态）并恢复初始种子数据，确认重置？',
     buttons:[{text:'取消'},{text:'确认重置',type:'danger',onClick:()=>{
       Object.keys(localStorage).forEach(k=>{if(k===DB_KEY||k===SESSION_KEY||k.indexOf(DRAFT_P)===0)localStorage.removeItem(k);});
       location.reload();}}]});
    return;
  }
  const ac=S.sn?getAc(S.sn):null;
  if(!ac){toast('请先扫码选择飞机');return;}
  if(act==='review-pass'){if(backendReview(ac,true)){toast('审核已通过，报告进入「后台批准中」');go('summary');}}
  else if(act==='review-rej')askReject('review');
  else if(act==='appr-pass'){if(backendApprove(ac,true)){toast('批准已通过，飞机已出厂，三日期已自动回填 🎉');go('summary');}}
  else if(act==='appr-rej')askReject('approve');
  else toast('当前进度无可执行的后台操作');
}
function askReject(stage){
  modal({title:(stage==='review'?'审核':'批准')+'驳回',
   html:'<div style="font-size:12px;color:var(--sub);margin-bottom:8px;line-height:1.6">驳回环节与原因将记录到当前报告；系统会自动生成新的检验报告并携带本次驳回原因，旧报告保留在履历。</div><textarea class="mtex" id="rejReason" placeholder="请填写驳回原因…"></textarea>',
   buttons:[{text:'取消'},{text:'确认驳回',type:'danger',onClick:({mask,close})=>{
     const v=$('#rejReason',mask).value.trim();
     if(!v){toast('请填写驳回原因');return false;}
     close();
     const ac=getAc(S.sn);
     const ok=stage==='review'?backendReview(ac,false,v):backendApprove(ac,false,v);
     if(ok){toast('已驳回，已自动生成新检验报告（携带驳回原因）');go('summary');}
   }}]});
}
/* ================= 全局事件委托 ================= */
document.addEventListener('click',e=>{
  const bk=e.target.closest('[data-back]');if(bk){go(bk.dataset.back);return;}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const sc=e.target.closest('[data-scan]');if(sc){enterAircraft(sc.dataset.scan);return;}
  const rp=e.target.closest('[data-report]');if(rp){go('report',{id:rp.dataset.report});return;}
  const vw=e.target.closest('[data-view]');if(vw){go(vw.dataset.view);return;}
  const op=e.target.closest('[data-open]');if(op){const p=op.dataset.open.split('|');go(p[1],{id:p[0]});return;}
  const tg=e.target.closest('[data-toggle]');if(tg){tg.closest('.collapse').classList.toggle('open');return;}
});
document.addEventListener('change',e=>{
  const pill=e.target.closest('.pills');
  if(pill){
    $$('.pill',pill).forEach(p=>p.classList.toggle('sel',$('input',p).checked));
    const req=e.target.closest('.req');if(req)req.classList.remove('invalid');
    updateGroupCounts();scheduleAutoSave();
  }
  const ov=e.target.closest('.ov-opt');
  if(ov){const wrap=ov.parentElement;$$('.ov-opt',wrap).forEach(o=>o.classList.toggle('sel',$('input',o).checked));}
});
document.addEventListener('input',e=>{
  if(e.target.closest('#formBody')){
    if(e.target.classList.contains('rec')){const req=e.target.closest('.req');if(req)req.classList.remove('invalid');}
    scheduleAutoSave();
  }
});
/* ================= 初始化 ================= */
loadDB();
resumeAutoTimers();
$('#fab').addEventListener('click',openDebug);
render();
</script>
</body>
</html>
