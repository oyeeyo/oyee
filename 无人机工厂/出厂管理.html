<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>无人机出厂进度 APP 原型</title>
<style>
/* ========== 设计令牌（与出厂表单填写原型同体系 · Linear Light） ========== */
:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e5e7eb; --line2:#f1f5f9;
  --t1:#0f172a; --t2:#334155; --t3:#64748b; --t4:#94a3b8;
  --acc:#2563eb; --acc-bg:#eff4ff; --acc-line:#dbe6f6;
  --ok:#16a34a; --ok-bg:#f0fdf4; --bad:#dc2626; --bad-bg:#fef2f2;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --r-lg:12px; --r-md:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--t1);background:#e8ecf3;text-wrap:pretty}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.screen{display:none;min-height:100vh;padding-bottom:84px}
.screen.on{display:block;animation:scrIn .22s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ========== 顶栏 ========== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .tt{font-size:15px;font-weight:600;flex:1}
.topbar .sub{font-size:11px;color:var(--t3);letter-spacing:.05em}
.backbtn{width:28px;height:28px;flex:none;border:none;background:transparent;border-radius:8px;color:var(--t2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.backbtn:active{background:var(--line2);transform:scale(.96)}
/* ========== 按钮 ========== */
.btn{height:40px;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;cursor:pointer;transition:transform .06s,background .15s,border-color .15s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--t1);color:#fff}
.btn-p:active{background:#1e293b}
.btn-s{background:#fff;border-color:var(--line);color:var(--t2)}
.btn-s:active{background:var(--line2)}
.btn-acc{background:var(--acc);color:#fff}
.btn-acc:active{background:#1d4ed8}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--bad)}
.btn-danger:active{background:var(--bad-bg)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-sm{height:32px;font-size:12px;border-radius:8px;padding:0 12px}
/* ========== 调试悬浮球 ========== */
#debug-fab{position:fixed;z-index:70;bottom:20px;right:max(12px,calc(50vw - 215px + 12px));display:flex;align-items:center;gap:5px;background:#0f172a;color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;border:none;box-shadow:0 4px 14px rgba(15,23,42,.28)}
#debug-fab:active{transform:scale(.96)}
/* ========== 全部工具首页 ========== */
.tools-card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px;padding:18px 8px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:7px;border:none;background:none;cursor:pointer;font-family:inherit;position:relative}
.tool-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e8f0fe,#cfdffb);color:var(--acc);transition:transform .08s}
.tool-ic svg{width:22px;height:22px}
.tool-item .tl{font-size:11px;color:var(--t2)}
.tool-item:active .tool-ic{transform:scale(.92)}
.tool-item.hot .tool-ic{background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 5px 12px rgba(37,99,235,.35)}
.tool-item.hot .tl{color:var(--acc);font-weight:600}
.tool-badge{position:absolute;top:-7px;right:6px;background:var(--bad);color:#fff;font-size:9px;font-weight:700;border-radius:999px;padding:1px 6px;letter-spacing:.05em}
/* ========== 出厂进度列表 ========== */
.filter-bar{margin:10px 12px 0;display:flex;flex-direction:column;gap:8px}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px}
.search-box svg{flex:none;color:var(--t4)}
.search-box input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:transparent;color:var(--t1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--t3);font-size:12px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--t1);border-color:var(--t1);color:#fff;font-weight:600}
.drone-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin:10px 12px 0;padding:12px 14px;cursor:pointer;transition:transform .08s}
.drone-card:active{transform:scale(.99);background:#fafcff}
.dc-top{display:flex;align-items:center;gap:8px}
.dc-no{font-size:14.5px;font-weight:700;flex:1}
.tag{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 8px;flex:none}
.tag.model{background:var(--acc-bg);color:var(--acc)}
.tag.repair{background:var(--warn-bg);color:var(--warn)}
.dc-st{font-size:11px;font-weight:700;flex:none}
.dc-st.ing{color:var(--acc)} .dc-st.ok{color:var(--ok)} .dc-st.bad{color:var(--bad)} .dc-st.warn{color:var(--warn)}
.dc-steps{display:flex;align-items:center;margin-top:12px}
.dc-steps .s{display:flex;align-items:center;gap:6px}
.dc-steps .s .dot{width:16px;height:16px;flex:none;border-radius:50%;background:var(--line2);color:var(--t4);font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700;box-sizing:border-box}
.dc-steps .s.done .dot{background:var(--ok);color:#fff}
.dc-steps .s.rdone .dot{background:var(--ok);color:#fff}
.dc-steps .s.rdone .lb{color:var(--t4)}
.dc-steps .s.act .dot{background:#f59e0b;color:#fff}
.dc-steps .s .lb{font-size:10px;color:var(--t4)}
.dc-steps .s.done .lb{color:var(--t2)}
.dc-steps .bar{flex:1;height:2px;background:var(--line2);border-radius:2px;margin:0 8px}
.dc-steps .bar.done{background:var(--ok)}
.dc-seg-label{margin-top:10px;font-size:10px;color:var(--t4);letter-spacing:.04em}
.dc-seg-label+.dc-steps{margin-top:4px}
.dc-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--t3)}
.empty{margin:44px 12px;text-align:center;color:var(--t4);font-size:12px}
/* ========== 飞机概要 ========== */
.sum-hero{margin:12px 12px 0;border-radius:16px;background:linear-gradient(135deg,#3f7ef0 0%,#2563eb 55%,#1d4ed8 100%);color:#fff;padding:14px 14px 12px;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.sum-top{display:flex;align-items:flex-start;gap:8px}
.sum-no{font-size:19px;font-weight:800;letter-spacing:.02em;flex:1}
.sum-owner{flex:none;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 10px;font-size:11px;background:rgba(255,255,255,.12)}
.sum-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sum-tags .tag{background:rgba(255,255,255,.18);color:#fff}
.sum-trace{flex:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px 11px;font-size:11px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.88);cursor:pointer;font-family:inherit;transition:background .15s}
.sum-trace:active{background:rgba(255,255,255,.22)}
.sum-seg-label{margin-top:12px;font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.04em;padding-left:2px}
.sum-steps{margin-top:12px;background:rgba(255,255,255,.14);border-radius:12px;padding:12px 6px;display:flex;align-items:flex-start}
.sum-seg-label+.sum-steps{margin-top:6px}
.ss{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.ss .n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-sizing:border-box}
.ss.act .n{background:#f59e0b;color:#fff;box-shadow:0 0 0 4px rgba(245,158,11,.25)}
.ss.done .n{background:#fff;color:var(--acc)}
.ss.rdone .n{background:#fff;color:var(--acc)}
.ss.rdone .t{color:rgba(255,255,255,.75)}
.ss.rdone .s{color:rgba(255,255,255,.5)}
.ss.rdone .ln{background:rgba(255,255,255,.35)}
.ss .t{font-size:12px;font-weight:600}
.ss .s{font-size:10px;color:rgba(255,255,255,.75)}
.ss .ln{position:absolute;top:13px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:rgba(255,255,255,.3)}
.ss.done .ln{background:rgba(255,255,255,.85)}
.ss:last-child .ln{display:none}
.sec-h{display:flex;align-items:center;gap:6px;margin:16px 14px 0;font-size:12.5px;font-weight:700;color:var(--t2)}
.sec-h .cnt{background:var(--acc-bg);color:var(--acc);border-radius:6px;font-size:10.5px;padding:1px 7px;font-weight:700}
.sec-h .right{margin-left:auto;font-size:11px;color:var(--acc);border:none;background:none;cursor:pointer;font-family:inherit;font-weight:500}
.sec-h .right:active{opacity:.6}
.todo-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin:8px 12px 0;padding:12px 14px;display:flex;align-items:center;gap:10px}
.todo-ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center}
.todo-ic svg{width:16px;height:16px}
.todo-b{flex:1;min-width:0}
.todo-st{flex-shrink:0;font-size:12px;font-weight:600;color:var(--acc);background:rgba(37,99,235,.08);border-radius:6px;padding:4px 10px}
.todo-t{font-size:13px;font-weight:700}
.todo-s{font-size:11px;color:var(--t3);margin-top:2px}
.todo-role{font-size:10px;color:var(--t4);margin-top:3px}
.todo-role b{color:var(--warn);font-weight:600}
.rpt-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--t1);font-weight:600;margin:8px 12px 0;cursor:pointer}
.rpt-item:active{background:#fafcff}
.rpt-item .rs{margin-left:auto;text-align:right;flex:none}
.rpt-item .rs .st{font-size:11px;font-weight:700}
.rpt-item .rs .sb{font-size:10px;color:var(--t4);font-weight:400;margin-top:1px}
.st-ok{color:var(--ok)} .st-bad{color:var(--bad)} .st-ing{color:var(--acc)} .st-warn{color:var(--warn)} .st-mut{color:var(--t4)}
.trace-bar{margin:10px 12px 0;border:1px dashed var(--warn-line);background:var(--warn-bg);border-radius:var(--r-lg);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--warn)}
.trace-bar .btn{flex:none;height:30px;padding:0 12px;font-size:12px;background:#fff;border-color:var(--warn-line);color:var(--warn)}
.old-list{margin:10px 12px 0}
.old-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--t2)}
.old-item + .old-item{margin-top:6px}
.old-item .st{margin-left:auto;font-weight:600;flex:none}
/* ========== 表单（试飞/出货检验同构，沿用参考件） ========== */
.meta-strip{display:flex;gap:8px;margin:10px 12px 0}
.meta-chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.meta-chip .k{font-size:10.5px;color:var(--t4);letter-spacing:.08em}
.meta-chip .v{font-size:13px;font-weight:700;color:var(--t1)}
.reason-banner{margin:10px 12px 0;border:1px solid #fecaca;background:var(--bad-bg);border-radius:var(--r-lg);padding:10px 14px;font-size:12px;color:var(--bad)}
.reason-banner b{display:block;margin-bottom:2px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin:10px 12px 0;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.grp-h .gi{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.grp-h .gt{font-size:13px;font-weight:700;flex:1}
.grp-h .arr{color:var(--t4);font-size:12px;transition:transform .2s;flex:none}
.grp.closed .arr{transform:rotate(-90deg)}
.grp.closed .grp-b{display:none}
.grp-b{padding:0 12px 12px}
.req-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.req-row + .req-row{margin-top:8px}
.sub-req{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.item-h{margin:10px 2px 0;font-size:11.5px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:6px}
.item-h::before{content:"";width:3px;height:10px;border-radius:2px;background:var(--acc);opacity:.5}
.item-h + .req-row{margin-top:6px}
.req-row .ct{font-size:13px;font-weight:600}
.req-row .rq{font-size:11.5px;color:var(--t4);margin-top:2px}
.f-label{font-size:10.5px;color:var(--t3);letter-spacing:.08em;margin:9px 0 4px;display:flex;align-items:center;gap:4px}
.f-label .req-star{color:var(--bad)}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--t1);background:#fff;font-family:inherit;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:56px}
.judge{display:flex;gap:8px}
.judge label{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--t3);cursor:pointer;transition:all .15s}
.judge input{display:none}
.judge label.on-ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);font-weight:700}
.judge label.on-bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);font-weight:700}
/* ========== 检验项现场照片 ========== */
.f-label .opt{color:var(--t4);letter-spacing:0;font-weight:400}
.img-grid{display:flex;flex-wrap:wrap;gap:8px}
.img-cell{position:relative;width:62px;height:62px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f8fafc}
.img-cell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.img-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;border:none;background:rgba(15,23,42,.62);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0;cursor:pointer}
.img-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:62px;height:62px;border:1px dashed var(--acc-line);border-radius:8px;background:var(--acc-bg);color:var(--acc);font-size:10px;cursor:pointer;text-align:center}
.img-add .pl{font-size:15px;line-height:1}
.view-imgs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px}
.view-imgs img{width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.xt-thumbs{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.xt-thumbs img{width:30px;height:30px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;display:block}
.img-mask{position:fixed;inset:0;z-index:95;background:rgba(2,6,23,.9);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
.img-mask img{max-width:100%;max-height:78vh;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.img-mask .img-close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-mask .img-cap{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:rgba(226,232,240,.85);font-size:11.5px}
.flash-bad{outline:2px solid transparent;border-radius:8px;animation:flashBad .5s ease 4}
@keyframes flashBad{0%,100%{outline-color:transparent}50%{outline-color:var(--bad)}}
.sig-reuse-hint{font-size:11px;color:var(--t3);margin-top:6px}
.sign-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sign-row .who{font-size:12.5px;font-weight:600}
.sign-row .who small{display:block;font-size:10.5px;color:var(--t4);font-weight:400}
.sign-thumb{height:36px;max-width:130px;object-fit:contain}
.sign-ops{display:flex;align-items:center;gap:8px;flex:none}
.hand{font-family:"Kaiti SC","STKaiti","KaiTi","DFKai-SB",cursive;font-size:19px;color:#1e293b;transform:rotate(-2deg);display:inline-block;line-height:1.1}
/* ========== 底部操作栏 ========== */
.action-bar{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.action-bar .btn{flex:1}
/* ========== 明细页 Excel 表格 ========== */
.xwrap{margin:10px 12px 0;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.xscroll{overflow-x:auto}
.xtable{border-collapse:collapse;font-size:11.5px;min-width:640px;width:100%}
.xtable th{background:#eef2f9;color:var(--t2);font-weight:600;padding:8px 8px;border:1px solid var(--line);white-space:nowrap}
.xtable td{padding:7px 8px;border:1px solid var(--line);color:var(--t1)}
.xtable td.cat{background:#f8fafc;font-weight:600}
.xtitle{padding:10px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.xtitle small{font-size:10.5px;color:var(--t4);font-weight:400}
.xfoot{padding:10px 14px;font-size:12px;color:var(--t2);border-top:1px solid var(--line)}
.xfoot + .xfoot{border-top:none}
.xfoot .ok{color:var(--ok);font-weight:700}
.sign-strip{position:relative;padding:12px 14px 16px;border-top:1px solid var(--line)}
.sign-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);padding:3px 0;flex-wrap:wrap}
.sign-line .ck{width:14px;height:14px;flex:none;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
.sign-line .tm{color:var(--t3)}
.seal{position:absolute;right:14px;top:2px;width:110px;height:110px;opacity:.92;pointer-events:none;transform:rotate(-8deg)}
/* ========== 明细页 · 一张表一体检测报告（移植 H5：扫描件样式，信息栏+明细+结论+签署同页文书） ========== */
.doc-view{margin:10px 10px 0;padding:10px 0 6px;background:#e8ecf3}
.doc-fit{width:100%;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;cursor:zoom-in}
.doc-fit .doc-page{width:640px;flex:none;transform-origin:top center}
.doc-hint{text-align:center;font-size:10.5px;color:var(--t3);padding-top:7px}
/* 明细文书 · 图片预览式全屏放大 */
.zoom-mask{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.94);animation:fade .18s}
.zoom-close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:92;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom-close:active{background:rgba(255,255,255,.28)}
.zoom-body{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(54px + env(safe-area-inset-top)) 10px 26px}
.zoom-body .doc-page{width:640px;max-width:none;margin:0 auto;cursor:default}
.doc-page{position:relative;overflow:hidden;background:#fff;border:1px solid #d5dbe6;padding:18px 16px 14px;color:#374151;font-family:"Songti SC","STSong","SimSun",Georgia,"Times New Roman",serif}
/* 页眉：居中大字标题 + 表单受控号行（检测报告样张式） */
.doc-ttl{text-align:center;font-size:26px;font-weight:800;letter-spacing:10px;text-indent:10px;color:#111827;padding:2px 0 8px}
.doc-norow{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:#374151;padding:0 2px 8px}
/* 报告信息栏：四列 label/value 带框表，与明细表边框相连 */
.doc-info{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.doc-info td{border:1px solid #444;padding:5px 8px;color:#374151;text-align:center;line-height:1.5;word-break:break-all}
.doc-info td.lbl{font-weight:700;color:#111827;white-space:nowrap}
/* 检验明细表：深色细边框、表头加粗白底、单元格居中（扫描件观感） */
.doc-main{width:100%;min-width:600px;border-collapse:collapse;font-size:11px;margin-top:-1px;table-layout:fixed}
.doc-main td,.doc-main th{border:1px solid #444;padding:5px 6px;color:#374151;line-height:1.5;word-break:break-all;text-align:center;vertical-align:middle}
.doc-main th{background:#fff;font-weight:700;color:#111827;white-space:nowrap}
.doc-main td.lbl{font-weight:700;color:#111827;white-space:nowrap}
.doc-main td.cat{font-weight:600;color:#111827}
.doc-main td.anom{text-align:left;padding:6px 10px}
.doc-main td.ok{color:var(--ok);font-weight:700}
.doc-main td.bad{color:var(--bad);font-weight:700}
/* 检验结论：表下加粗段落（样张「检测结论」式） */
.doc-concl{margin-top:10px;font-size:12.5px;font-weight:700;color:#111827;line-height:1.8}
.doc-concl .ck{font-weight:700}
.doc-concl .ck.off{color:var(--t4);font-weight:400}
/* 签署横排：检验/审核/批准 + 签发日期（日期章压盖），表下样张式 */
.doc-signrow2{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;padding:0 4px 6px;font-size:12px;color:#111827}
.doc-signrow2 .sg{display:flex;align-items:center;gap:4px;white-space:nowrap}
.doc-signrow2 .hand{font-size:20px;color:#1e293b}
.doc-signrow2 img{height:30px;max-width:72px;object-fit:contain}
.doc-signrow2 .issue{position:relative;padding-right:62px}
.doc-signrow2 .issue .date-seal{position:absolute;right:-12px;top:-38px}
.date-seal{width:74px;height:74px;flex:none;transform:rotate(-8deg);mix-blend-mode:multiply;opacity:.92;pointer-events:none}
/* 页脚：公司/地址/电话 三段横排（样张底部式） */
.doc-foot2{display:flex;justify-content:space-between;gap:12px;margin-top:30px;font-size:10.5px;color:#374151;line-height:1.6}
.doc-foot2 b{font-weight:700;color:#111827}
/* ========== 履历页 ========== */
.hero{margin:12px 12px 0;border-radius:16px;background:linear-gradient(180deg,#dce7f8,#edf3fc);border:1px solid var(--acc-line);padding:14px 0 6px;display:flex;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin:10px 12px 0;padding:12px 14px}
.card-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--t1)}
.card-h .ic{width:18px;height:18px;flex:none;border-radius:6px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center}
.card-h .ic svg{width:11px;height:11px}
.card-h .link{margin-left:auto;font-size:12px;font-weight:500;color:var(--acc);cursor:pointer;display:flex;align-items:center;gap:2px;border:none;background:none;font-family:inherit}
.card-h .link:active{opacity:.6}
.rows{margin-top:4px}
.krow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0;font-size:12.5px}
.krow + .krow{border-top:1px solid var(--line2)}
.krow .k{color:var(--t3);flex:none}
.krow .v{color:var(--t1);font-weight:600;text-align:right}
.krow .v.ok{color:var(--ok)}
.footer{padding:20px 0 12px;text-align:center;font-size:11px;color:var(--t4)}
.banner{margin:10px 12px 0;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);border-radius:var(--r-lg);padding:10px 14px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner .btn{flex:none;height:30px;padding:0 12px;font-size:12px;background:var(--warn);color:#fff;border-radius:8px}
/* ========== 审核/批准 ========== */
.audit-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ro-hint{margin:10px 12px 0;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--t4);text-align:center}
/* ========== 后台流转时间线（概要页用） ========== */
.timeline{margin:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:22px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:1px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:23px;height:23px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--line);background:#fff;color:var(--t4)}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-item.act .tl-dot{border-color:var(--acc);color:var(--acc)}
.tl-item.act .tl-dot .sp{width:10px;height:10px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.tl-item.bad .tl-dot{background:var(--bad);border-color:var(--bad);color:#fff}
.tl-t{font-size:13px;font-weight:600}
.tl-s{font-size:11px;color:var(--t3);margin-top:1px}
.tl-item.bad .tl-t{color:var(--bad)}
/* ========== 弹窗 ========== */
.mask{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease}
.sheet-h{font-size:15px;font-weight:700;margin-bottom:4px}
.sheet-s{font-size:12px;color:var(--t3);margin-bottom:12px}
.sheet .btn-row{display:flex;gap:10px;margin-top:14px}
.sheet .btn-row .btn{flex:1}
.verdict-pick{display:flex;gap:10px}
.verdict-pick label{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:14px;font-weight:700;color:var(--t3)}
.verdict-pick input{display:none}
.verdict-pick label small{display:block;font-size:10.5px;font-weight:400;color:var(--t4);margin-top:2px}
.verdict-pick label.on-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.verdict-pick label.on-bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.v-counts{display:flex;gap:8px;margin:0 0 10px}
.vc{font-size:11px;border-radius:6px;padding:3px 10px;background:var(--line2);color:var(--t3);font-weight:600}
.vc.ok{background:var(--ok-bg);color:var(--ok)}
.vc.bad{background:var(--bad-bg);color:var(--bad)}
.sig-wrap{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;animation:fade .18s}
.sig-rot{transform:rotate(90deg);width:min(86vh,680px);height:min(92vw,398px);background:#fff;border-radius:16px;padding:16px 18px;box-sizing:border-box;display:flex;flex-direction:column}
.sig-h{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.sig-h span{font-size:11px;color:var(--t4);font-weight:400}
.sig-who{font-size:12px;color:var(--t3);margin:4px 0 10px}
.sig-canvas-l{flex:1;width:100%;min-height:0;border:1px dashed var(--line);border-radius:10px;background:#fbfdff;touch-action:none}
.sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
/* ========== 调试面板 ========== */
.dbg-panel{position:fixed;z-index:90;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#0f172a;color:#e2e8f0;border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));animation:up .22s ease;max-height:72vh;overflow-y:auto}
.dbg-panel h4{font-size:11px;letter-spacing:.14em;color:#64748b;margin:12px 0 6px;text-transform:uppercase}
.dbg-panel h4:first-child{margin-top:0}
.dbg-seg{display:flex;gap:6px}
.dbg-seg button{flex:1;height:32px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;cursor:pointer;font-family:inherit}
.dbg-seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.dbg-row{display:flex;gap:8px;margin-top:8px}
.dbg-row .btn{flex:1;height:34px;font-size:12px;border-radius:8px}
.dbg-note{font-size:10.5px;color:#64748b;margin-top:6px;line-height:1.5}
.dbg-close{position:absolute;top:10px;right:12px;border:none;background:none;color:#64748b;font-size:16px;cursor:pointer}
/* ========== 报告只读查看 ========== */
.view-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px;border-top:1px dashed var(--line2)}
.view-line .vk{color:var(--t3);flex:none}
.view-line .vv{color:var(--t1);font-weight:600;text-align:right}
/* ========== Toast ========== */
.toast{position:fixed;z-index:100;top:60px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font-size:12px;padding:8px 16px;border-radius:999px;animation:fade .2s;max-width:86%;text-align:center}
</style>
</head>
<body>
<div id="app">
  <section id="scr-tools" class="screen"></section>
  <section id="scr-list" class="screen"></section>
  <section id="scr-summary" class="screen"></section>

</div>

<button id="debug-fab" type="button"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="2.2"/><path d="M6 1v2M6 9v2M1 6h2M9 6h2M2.5 2.5l1.4 1.4M8.1 8.1l1.4 1.4M9.5 2.5 8.1 3.9M3.9 8.1 2.5 9.5"/></svg> 调试</button>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
/* ================= 角色与数据字典 ================= */
const ROLES = {
  captain:{ label:'测试人员', name:'陈天生', code:'01458031' },
  algorithm:{ label:'算法人员', name:'孙七', code:'01458034' },
  inspector:{ label:'检验人', name:'张三', code:'01458029' },
  reviewer:{ label:'审核人', name:'赵四', code:'01458032' },
  approver:{ label:'批准人', name:'王五', code:'01458033' }
};
const SPECS = {
  sn:'ARK40', model:'ARK40', category:'多旋翼', level:'中型（25kg≤起飞重量<150kg）',
  org:'丰翼科技（深圳）有限公司', regNo:'UAS4024xx', productCode:'FY01ARK40xxxxAYMU0',
  empty:'25kg', mtow:'48kg', dims:'2.5×2.5×0.5m', payload:'10kg / 20km', cargo:'60L',
  maker:'江西丰羽顺途科技有限公司', mfgDate:'2026-07-02',
  addr:'江西省南昌市临空经济区兴业大道 666 号丰羽智能制造产业园'
};
/* 试飞报告模板：拆分为「试飞情况」（测试人员填写）与「数据分析」（算法人员反馈）两部分 · 检验项目 → 检验内容 → 检验要求 */
const FT_PARTS = (()=>{ let n=0;
  const build = gs => gs.map(g=>({ item:g.item, contents:g.contents.map(c=>({ content:c.content, reqs:c.reqs.map(req=>({ id:'f'+(++n), req })) })) }));
  const flight = build([
  { item:'试飞情况', contents:[
    { content:'飞前检查', reqs:[
      '电机安装正确，指标一上一下；1号电机向前，从机框往机头数：1、2号电机呈“外八”、内圈',
      '正反桨安装正确，桨叶无缺损、裂纹、鼓包现象',
      '视觉镜头头无异物遮挡',
      '机身脚架碳管无变形、裂纹、损伤，各部位螺丝已拧紧',
      '管夹检查，管夹无变形、裂纹、损伤，铆钉/螺丝安装到位，无漏锁、无滑拧' ]},
    { content:'初次上电测试', reqs:[
      '飞机上电后地面站无人机显示列表可见对应编号飞机',
      '飞机灯色显示正常，机头朝向、机尾方向灯色符合定义（红前绿后）',
      '电池电压、压差在规格范围内，无告警',
      '上电后系统自检完成，地面站软件故障信息列表无任何告警信息',
      '飞机上电静止放置时，飞控姿态数据与实际水平显示一致，无明显偏差',
      '单电池解锁关机，其他3个电池同步解锁，SFE无告警提示音；新款电池检查四个电池和电磁铁连接接口无松动',
      '单电池解锁关机，其他3个电池同步关机' ]},
    { content:'搜星情况', reqs:['地面静止状态冲动2min，搜星数≥12颗，导航进入POS模式，最终进入RTK模式']},
    { content:'手动模式测试', reqs:['遥控器打开俯仰、横滚、偏航、油门各通道打开响应正常，方向对应正确，无迟滞、反方向']},
    { content:'悬停情况', reqs:['飞机悬停时，无明显漂离、异常抖动（会误报桨叶动不平衡/桨叶破损）、异常点头现象']},
    { content:'飞行状态', reqs:['飞机调整飞行时，飞行高度偏差误差≤±1.5m']},
    { content:'视觉降落', reqs:['自动降落过程中无视觉修正过程、无明显悬晃现象，飞机中心点没有超出同心圆最外圈范围']} ]} ]);
  const data = build([
  { item:'数据分析', contents:[
    { content:'导航分析结果', reqs:['算法组导航分析结果合格']},
    { content:'控制分析结果', reqs:['算法组控制分析结果合格']} ]} ]);
  return { flight, data }; })();
const FT_FLIGHT_TEMPLATE = FT_PARTS.flight;   /* 试飞报告第一部分：试飞情况（测试人员填写并判定） */
const FT_DATA_TEMPLATE   = FT_PARTS.data;     /* 试飞报告第二部分：数据分析（算法人员反馈并判定） */
/* 出货检验报告模板：类别 → 检验项目 → 检验内容 → 判定标准要求 */
const SH_TEMPLATE = (()=>{ let n=0; const R=(content,req)=>({ id:'s'+(++n), content, req }); return [
  { cat:'整机结构', items:[
    { item:'机臂', rows:[ R('碳管','表面无裂纹、破损、划痕'), R('碳管连接件','AB胶涂抹均匀，胶水黑化，无流挂'), R('管夹','AB胶涂抹均匀，胶水黑化，无流挂，管夹位置安装正确'), R('斜拉杆','斜拉杆、斜拉杆盖与碳管配合无间隙，螺丝安装到位，无漏锁、无滑拧') ]},
    { item:'机身', rows:[ R('底板、顶板、边条','表面无裂纹、破损及污渍，无漏锁，铆钉及螺母无倾斜无松动'), R('铭牌、民航注册码','飞机编号、无人机铭牌、民航注册码标识清晰、数据准确、无漏贴'), R('机身螺丝','整机螺丝、铆钉安装到位，无漏锁、无滑拧'), R('电池舱','螺丝、铆钉安装到位，无漏锁、无滑拧，电池舱开合顺畅'), R('航电盖板','表面无裂纹、破损及污渍，螺丝及垫片安装到位，无漏锁、无滑拧，RTK天线无松动，垫片贴合牢固') ]},
    { item:'脚架', rows:[ R('脚架碳管','飞机无高低脚、脚架安装牢固，无松动'), R('脚架内部天线','脚架内部天线组件安装牢固，无松动') ]},
    { item:'货舱', rows:[ R('拨扣支架','货舱开合顺畅无干涉，拨扣支架螺丝安装到位，无漏锁、无滑拧') ]},
    { item:'降落伞', rows:[ R('舱盖','舱盖安装牢固，警示标识已粘贴'), R('伞绳','伞绳露出舱盖长度一致，伞绳固定牢固、无破损') ]},
    { item:'整机', rows:[ R('重量','整机重量：记录实测值') ]} ]},
  { cat:'整机动力', items:[
    { item:'电机', rows:[ R('电机座','螺丝安装到位，无漏锁、无滑拧，螺丝力矩值为 3.0±0.3N·m'), R('电机','表面无划痕、破损，倒角正确（外倾），电机编号与机臂编号一致'), R('电机','电机转动顺滑无异响，无卡滞') ]},
    { item:'桨叶', rows:[ R('桨叶','表面无径向无裂痕：中间、裂纹、叶尖、前缘后缘无裂无缺、破损，正反桨叶放置正确'), R('桨叶螺丝','上下夹盘、桨叶、电机配合无间隙，螺丝安装到位，无漏锁、无滑拧') ]} ]},
  { cat:'航电功能性', items:[
    { item:'链路', rows:[ R('遥控/图传链路','遥控/图传链路稳定') ]},
    { item:'RTK', rows:[ R('RTK定位','RTK定位精度≤2cm') ]} ]},
  { cat:'可靠性测试', items:[
    { item:'航线飞行', rows:[ R('自动航线执行','自动航线执行正常') ]},
    { item:'失效保护', rows:[ R('失联返航','失联返航功能正常') ]} ]}
]; })();
const ftFlightRows = () => FT_FLIGHT_TEMPLATE.flatMap(g=>g.contents.flatMap(c=>c.reqs));
const ftDataRows   = () => FT_DATA_TEMPLATE.flatMap(g=>g.contents.flatMap(c=>c.reqs));
const ftRows = () => ftFlightRows().concat(ftDataRows());
const shRows = () => SH_TEMPLATE.flatMap(g=>g.items.flatMap(i=>i.rows));
const REJECT_REASONS = [
  '漆面右后臂下方轻微划痕，需补漆后复检',
  '续航测试记录不完整，请补充满载续航数据后重新提交',
  '标识贴纸未贴齐，缺少 SN 序列号贴纸',
  'RTK 复测定位精度超差，需重新校准后复检',
  '链路图传偶发丢包，需复查天线接头后重新提交'
];
/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const p2 = n => String(n).padStart(2,'0');
const fmtD  = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fmtDT = d => fmtD(d)+' '+p2(d.getHours())+':'+p2(d.getMinutes());
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
let toastTimer = null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, 2200); }
const handSign = name => `<span class="hand">${esc(name)}</span>`;
const signHtml = sign => (sign && sign.img) ? `<img class="sign-thumb" src="${sign.img}" alt="签名">` : (sign ? handSign(sign.name) : '');
/* ================= 状态管理 ================= */
const LS_KEY = 'ark40_app_proto_v3';   /* V13：试飞报告拆分试飞情况/数据分析，存储键升级以加载新演示数据 */
const IMG_MAX = 4;                                   /* 单个检验项最多上传照片数 */
const imgsOf = rec => (rec && rec.imgs) || [];
function demoImg(txt, c1, c2){                       /* 演示用示意照片（内联 SVG，不占带宽） */
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs>'
    + '<rect width="240" height="180" fill="url(#g)"/><circle cx="198" cy="36" r="17" fill="rgba(255,255,255,.22)"/>'
    + '<text x="14" y="164" font-family="sans-serif" font-size="15" fill="rgba(255,255,255,.95)">'+txt+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
/* 试飞情况演示数据（测试人员填写部分） */
function seedFtRows(){ const rows={}; ftFlightRows().forEach((r,i)=>{ rows[r.id]={ rec:'正常', res:'pass' };
  if(i===1) rows[r.id].imgs=[ demoImg('试飞现场-01','#475569','#94a3b8') ];
  if(i===3) rows[r.id].imgs=[ demoImg('试飞现场-02','#0f766e','#14b8a6'), demoImg('试飞现场-03','#334155','#64748b') ];
  }); return rows; }
/* 数据分析演示数据（算法人员反馈部分） */
function seedFtDataRows(){ const rows={}; ftDataRows().forEach((r,i)=>{ rows[r.id]={ rec:'分析结果合格', res:'pass' };
  if(i===0) rows[r.id].imgs=[ demoImg('数据分析截图-01','#1e3a8a','#3b82f6') ];
  }); return rows; }
function seedShRows(){ const rows={}; shRows().forEach(r=>{ let rec='正常';
  if(r.content==='重量') rec='47.6kg'; if(r.content==='RTK定位') rec='1.2cm'; if(r.content==='电机座') rec='力矩 3.0N·m';
  rows[r.id]={ rec, res:'pass' };
  if(r.content==='重量') rows[r.id].imgs=[ demoImg('称重现场-01','#334155','#64748b') ];
  if(r.content==='RTK定位') rows[r.id].imgs=[ demoImg('RTK复测-01','#1e40af','#3b82f6'), demoImg('RTK复测-02','#0f766e','#10b981') ];
  if(r.content==='电机座') rows[r.id].imgs=[ demoImg('力矩校验-01','#7c2d12','#f59e0b') ];
  }); return rows; }
/* 试飞报告：status = draft(待填写试飞情况) / pending_data(待数据分析) / passed(试飞通过) / failed(试飞未通过) */
function newFtReport(d, round, prevReason){ return { id:'ft'+d.no+round, round, date:fmtD(new Date()), status:'draft', locked:false, passed:null,
  flightVerdict:null, dataVerdict:null, rows:{}, anomaly:'', dataAnomaly:'', filler:null, dataFiller:null,
  rejectStage:null, rejectReason:'', prevReason:prevReason||'' }; }
function newShReport(d, round, prevReason){ return { id:'sh'+d.no+round, round, no:'OB-'+d.no+'-'+round, status:'draft', locked:false,
  date:fmtD(new Date()), rows:{}, anomaly:'', sign:null, dates:null, persons:null, reportDate:null, prevReason:prevReason||'' }; }
function defaultState(){
  /* 已通过的试飞报告：试飞情况 + 数据分析 双判定合格 */
  const ftP=(no,dte)=>({ id:'ftp'+no, round:1, date:dte, status:'passed', locked:true, passed:true, flightVerdict:'pass', dataVerdict:'pass',
    rows:Object.assign(seedFtRows(), seedFtDataRows()), anomaly:'', dataAnomaly:'',
    filler:{ name:'陈天生', code:'01458031', time:dte+' 17:00' }, dataFiller:{ name:'孙七', code:'01458034', time:dte+' 18:30' },
    rejectStage:null, rejectReason:'', prevReason:'' });

/* 图片读取：等比压缩（最长边 800px）后转 dataURL，降低本地存储占用 */
function readImgFile(file){
  return new Promise(res=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image();
      img.onload = ()=>{ try{
        const k = Math.min(1, 800/Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width*k)); cv.height = Math.max(1, Math.round(img.height*k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', .68));
      }catch(err){ res(fr.result); } };
      img.onerror = ()=>res(fr.result);
      img.src = fr.result; };
    fr.onerror = ()=>res('');
    fr.readAsDataURL(file); });
}

    h += `<div class="view-line" style="margin-top:8px"><span class="vk">判定结论</span><span class="vv ${badD?'st-bad':'st-ok'}">${badD?('合格 '+(dN-badD)+' 项 · 不合格 '+badD+' 项'):('合格 '+dN+' 项')}</span></div>
      <div class="view-line"><span class="vk">数据分析异常记录</span><span class="vv">${esc(r.dataAnomaly)||'无'}</span></div>
      <div class="view-line"><span class="vk">算法人员</span><span class="vv">${r.dataFiller?(esc(r.dataFiller.name)+' '+esc(r.dataFiller.code)+' · '+esc(r.dataFiller.time)):'—'}</span></div>`;
  } else {
    h += `<div class="empty" style="margin:10px 0 4px">待分析 · 算法人员尚未反馈数据分析结果</div>`;
  }
  h += `</div></div>`;
  if(!r.dataVerdict && ftStatus(r)==='pending_data'){
    h += `<div class="ro-hint">数据分析是试飞报告的第二阶段：算法人员未反馈时，本报告仍可正常查看测试人员已提交的「试飞情况」部分。</div>`;
    if(S.role==='algorithm') h += `<div class="action-bar"><button class="btn btn-p" data-act="go-data">反馈数据分析结果</button></div>`; }
  if(r.locked) h += `<div class="ro-hint">本报告判定为「${r.passed?'通过':'未通过'}」 · 已归档</div>`;
  show('view'); $('#scr-view').innerHTML=h;
}
function renderViewSh(r){
  if(r.status==='passed'){ renderDetail(r); return; }
  const tg=shTag(r);
  let h = `<div class="topbar"><button class="backbtn" data-act="back-sum">‹</button><span class="tt">第 ${r.round} 次出货检验</span><span class="sub">${D.no}</span></div>`;
  h += `<div class="meta-strip"><div class="meta-chip"><div class="k">检验日期</div><div class="v">${r.date}</div></div>
    <div class="meta-chip"><div class="k">报告状态</div><div class="v ${tg.cls}" style="font-size:12px">${tg.t} · ${tg.sb}</div></div></div>`;
  if(r.prevReason) h += `<div class="reason-banner"><b>上次驳回原因（随本报告携带）</b>${esc(r.prevReason)}</div>`;
  if(r.status==='traced') h += `<div class="reason-banner" style="border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)"><b>回溯作废 · 回溯原因</b>${esc(r.tracedReason||'')}</div>`;
  h += `<div class="xwrap"><div class="xtitle">出货检验报告<small>第 ${r.round} 次</small></div>${xtableHtml(r)}
    <div class="xfoot">其他异常记录：&nbsp; ${esc(r.anomaly)||'无'}</div></div>`;
  h += `<div class="card"><div class="sign-row"><div class="who">检验人电子签名</div><span class="sign-ops">${signHtml(r.sign)||'未签名'}</span></div></div>`;
  if(r.status==='pending_review'||r.status==='pending_approve') h += `<div class="ro-hint">报告处于${r.status==='pending_review'?'审核':'批准'}环节，等待${r.status==='pending_review'?'审核':'批准'}人处理。</div>`;
  if(r.status==='draft') h += `<div class="ro-hint">本报告尚未提交，可在飞机概要页待办中继续填写。</div>`;
  show('view'); $('#scr-view').innerHTML=h;
}
/* ================= 返回试飞（检验→试飞，仅确认提醒） ================= */
function openTrace(){
  openModal(`<div class="sheet"><div class="sheet-h">返回试飞确认</div>
    <div class="sheet-s">当前处于「出货检验」阶段。确认返回试飞后：打回「试飞」阶段并生成新试飞报告；当前检验报告不保留，报告记录仅保留已提交（通过/不通过）的报告。</div>
    <div class="btn-row"><button class="btn btn-s" data-act="m-cancel">取消</button><button class="btn btn-p" data-act="tr-ok">确认返回试飞</button></div></div>`);
  $('#modal-root').querySelector('[data-act=tr-ok]').addEventListener('click', ()=>{
    D.sh.pop();
    D.trace.push({ time:fmtDT(new Date()), from:'出货检验', to:'试飞', by:me().name, reason:'' });
    D.stage='ft'; D.ft.push(newFtReport(D, D.ft.length+1));
    save(); closeModal(); toast('已返回试飞阶段，当前检验报告不保留'); renderSummary(); });
}
function openDroneNew(){
  openModal(`<div class="sheet"><div class="sheet-h">新录入无人机</div>
    <div class="sheet-s">录入新无人机编号，创建后处于「试飞」阶段，可在其概要页进行出厂流程或返修操作。</div>
    <div class="f-label">无人机编号 <span class="req-star">*必填</span></div>
    <input type="text" id="rp-no" placeholder="如 ARK40-2415">
    <div class="btn-row"><button class="btn btn-s" data-act="m-cancel">取消</button><button class="btn btn-p" data-act="dn-ok">确认录入</button></div></div>`);
  $('#modal-root').querySelector('[data-act=dn-ok]').addEventListener('click', ()=>{
    const no=$('#rp-no').value.trim(); if(!no){ toast('请输入无人机编号'); return; }
    if(S.drones.find(x=>x.no===no)){ toast('该编号已存在：'+no); return; }
    S.drones.push({ no, type:'new', owner:me().name, stage:'ft', trace:[], ft:[ newFtReport({no},1) ], sh:[] });
    save(); closeModal(); toast('新无人机 '+no+' 已录入'); renderList();
  });
}
/* ================= 事件委托 ================= */
document.addEventListener('click', e=>{
  const fab=e.target.closest('#debug-fab');
  if(fab){ const p=$('#debug-panel'); p.hidden=!p.hidden; if(!p.hidden) renderDebug(); return; }
  const m=e.target.closest('.mask'); if(m && e.target===m){ closeModal(); return; }
  const actEl=e.target.closest('[data-act]'); if(!actEl) return;
  const act=actEl.dataset.act;
  if(act==='m-cancel'){ closeModal(); return; }
  switch(act){
    case 'noop': toast('演示首页：出厂管理入口在九宫格末位'); break;
    case 'tool': toast(TOOLS[+actEl.dataset.i].t+' 不在本原型演示范围'); break;
    case 'go-list': renderList(); break;
    case 'to-tools': renderTools(); break;
    case 'lf-st': S.lf.st=actEl.dataset.v; save(); renderList(); break;
    case 'open-drone': D=S.drones.find(x=>x.no===actEl.dataset.no); renderSummary(); break;
    case 'to-list': renderList(); break;
    case 'back-sum': renderSummary(); break;
    case 'doc-zoom': openDocZoom(); break;
    case 'zoom-close': { if(!e.target.closest('.zoom-body') || e.target.closest('.zoom-close')) closeModal(); break; }
    case 'go-ft': renderFlight(); break;
    case 'go-data': renderData(); break;
    case 'go-sh': renderShip(); break;
    case 'go-audit-review': renderAudit('review'); break;
    case 'go-audit-approve': renderAudit('approve'); break;
    case 'sh-regen': { const r=curSh(); D.sh.push(newShReport(D, D.sh.length+1, r.rejectReason||'')); save(); toast('已生成新出货检验报告（携带驳回原因）'); renderShip(); break; }
    case 'trace': openTrace(); break;
    case 'drone-new-open': openDroneNew(); break;
    case 'open-rpt': { const k=actEl.dataset.k, id=actEl.dataset.id;
      if(k==='sh'){ const r=D.sh.find(x=>x.id===id);
        r.status==='passed' ? renderDetail(r) : renderViewSh(r); }
      else { const fr=D.ft.find(x=>x.id===id);
        (ftStatus(fr)==='pending_data' && S.role==='algorithm') ? renderData() : renderViewFt(fr); } break; }
    case 'toggle': actEl.closest('.grp').classList.toggle('closed'); break;
    case 'sign': openSign(s=>{ if(CUR==='flight'){ curFt().sign=s; keepScroll(renderFlight); } else if(CUR==='ship'){ curSh().sign=s; keepScroll(renderShip); } save(); toast('签名完成'); }); break;
    case 'draft': save(); toast('已暂存'); break;
    case 'ft-submit': { const r=curFt();
      if(!ftAllJudged(r)){ flashUnjudged(); return; }
      openVerdict('ft'); break; }
    case 'data-submit': { const r=curFt();
      if(!ftDataAllJudged(r)){ flashUnjudged(); return; }
      openVerdict('data'); break; }
    case 'sh-submit': { const r=curSh();
      if(!shAllJudged(r)){ flashUnjudged(); return; }
      if(!r.sign){ toast('请先完成检验人电子签名'); return; }
      openVerdict('sh'); break; }
    case 'audit-sign': openSign(s=>{ const r=curSh(); r.signs=r.signs||{}; r.signs[actEl.dataset.kind]=s; save(); keepScroll(()=>renderAudit(actEl.dataset.kind)); toast('签名完成'); }); break;
    case 'audit-pass': { const k=actEl.dataset.kind, r=curSh();
      if(!r.signs || !r.signs[k]){ toast('请先完成'+(k==='review'?'审核':'批准')+'人电子签名'); break; }
      auditPass(k); break; }
    case 'audit-reject': openReason(actEl.dataset.kind); break;
    case 'img-zoom': openImg(actEl.src); break;
    case 'img-hold': break;
    case 'img-close': { const lay = actEl.classList.contains('img-mask') ? actEl : actEl.closest('.img-mask'); if(lay) lay.remove(); break; }
    case 'img-del': { const id=actEl.dataset.id, i=+actEl.dataset.i;
      const rr = (CUR==='flight'||CUR==='data') ? curFt() : (CUR==='ship' ? curSh() : null);
      const cell = rr && rr.rows[id]; if(!cell || !cell.imgs || !cell.imgs[i]) break;
      cell.imgs.splice(i,1); save();
      keepScroll(formRender); toast('已删除照片'); break; }
    case 'dbg-close': $('#debug-panel').hidden=true; break;
  }
});
window.addEventListener('resize', ()=>{ if(CUR==='detail') fitDoc(); });
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.lf.q=e.target.value; save(); paintListBody(); return; }
  const r = (CUR==='flight'||CUR==='data') ? curFt() : (CUR==='ship' ? curSh() : null);
  if(!r) return;
  if(e.target.matches('[data-rec]')){ const id=e.target.dataset.rec; (r.rows[id]=r.rows[id]||{}).rec=e.target.value; save(); }
  if(e.target.matches('[data-anomaly]')){ r.anomaly=e.target.value; save(); }
  if(e.target.matches('[data-anomaly2]')){ r.dataAnomaly=e.target.value; save(); }
});
document.addEventListener('change', e=>{
  const r = (CUR==='flight'||CUR==='data') ? curFt() : (CUR==='ship' ? curSh() : null);
  if(!r) return;
  if(e.target.matches('[data-judge]')){ const id=e.target.dataset.judge; (r.rows[id]=r.rows[id]||{}).res=e.target.value; save();
    keepScroll(formRender); }
  if(e.target.matches('[data-img-pick]')){
    const id=e.target.dataset.imgPick, files=[...(e.target.files||[])]; e.target.value='';
    const cell = (r.rows[id]=r.rows[id]||{}); cell.imgs = cell.imgs || [];
    const pics = files.filter(f=>/^image\//.test(f.type));
    if(!pics.length){ toast('请选择图片文件'); return; }
    const room = IMG_MAX - cell.imgs.length;
    if(room<=0){ toast('每个检验项最多上传 '+IMG_MAX+' 张照片'); return; }
    const take = pics.slice(0, room);
    if(take.length < pics.length) toast('每个检验项最多上传 '+IMG_MAX+' 张照片');
    Promise.all(take.map(readImgFile)).then(list=>{
      const ok = list.filter(Boolean);
      ok.forEach(u=>cell.imgs.push(u)); save();
      keepScroll(formRender);
      toast(ok.length ? ('已添加 '+ok.length+' 张现场照片') : '照片读取失败，请重试'); });
  }
});
/* ================= 调试面板 ================= */
function segHtml(key, opts, cur){ return `<div class="dbg-seg">`+opts.map(o=>`<button data-dbg="${key}" data-v="${o[0]}" class="${cur===o[0]?'on':''}">${o[1]}</button>`).join('')+`</div>`; }
function renderDebug(){
  $('#debug-panel').innerHTML = `
    <button class="dbg-close" data-act="dbg-close">✕</button>
    <h4>当前角色（待办下发 / 审核批准执行）</h4>
    ${segHtml('role', [['captain','测试人员'],['algorithm','算法人员'],['inspector','检验人'],['reviewer','审核人'],['approver','批准人']], S.role)}
    <div class="dbg-note">模拟切换登录角色：登录完成后，填写/审核/批准报告单自动绑定对应人员（签名、日期自动记录），无需手动选择。</div>
    <h4>表单一键合格（演示）</h4>
    <div class="dbg-row"><button class="btn btn-s" data-dbg="pass-ft">试飞报告一键合格</button><button class="btn btn-s" data-dbg="pass-sh">出货检验报告一键合格</button></div>
    <div class="dbg-note">在对应填写页点击后，本页所有检验项的「检验结果」自动置为合格，检验记录为空时填「符合检验要求」；总体检验判定仍需手动点击提交并在弹窗中选择。</div>
    <h4>演示数据</h4>
    <div class="dbg-row"><button class="btn btn-s" data-dbg="wipe">清空重置</button></div>
    <div class="dbg-note">返回试飞：检验阶段在飞机概要页点「返回试飞」，确认后打回试飞阶段；当前检验报告不保留，仅记录返回试飞事件。</div>`;
}
/* 演示：当前填写页所有检验项一键置为合格（总体判定仍手动） */
function dbgPassAll(kind){
  const pages = kind==='ft' ? ['flight','data'] : ['ship'];
  if(!pages.includes(CUR)){ toast(kind==='ft' ? '请先进入试飞报告填写页（试飞情况 / 数据分析）' : '请先进入出货检验填写页'); return; }
  const r = kind==='ft' ? curFt() : curSh();
  if(!r){ toast('当前没有可填写的报告'); return; }
  const editable = kind==='ft' ? (CUR==='data' ? ftStatus(r)==='pending_data' : ftStatus(r)==='draft') : r.status==='draft';
  if(!editable){ toast('当前报告已提交，不可再填写'); return; }
  const rows = kind==='ft' ? (CUR==='data' ? ftDataRows() : ftFlightRows()) : shRows();
  rows.forEach(row=>{ const c = r.rows[row.id] = r.rows[row.id]||{}; c.res='pass'; if(!c.rec) c.rec='符合检验要求'; });
  save(); keepScroll(formRender);
  toast('已将 '+rows.length+' 项检验结果置为合格，请手动完成整体判定并提交');
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-dbg]'); if(!b) return;
  const k=b.dataset.dbg, v=b.dataset.v;
  if(k==='role'){ S.role=v; save(); renderDebug(); toast('已切换为 '+ROLES[v].label+' '+ROLES[v].name); if(CUR==='summary') renderSummary(); }
  if(k==='pass-ft') dbgPassAll('ft');
  if(k==='pass-sh') dbgPassAll('sh');
  if(k==='wipe'){ try{localStorage.removeItem(LS_KEY);}catch(err){} S=defaultState(); D=null; save(); renderDebug(); renderTools(); toast('演示数据已重置'); }
});
/* ================= 初始化 ================= */
renderTools();
</script>
</body>
